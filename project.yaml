# Project-wide configuration for the Antier Video Production Agent.
# Record tool versions here during first-run setup (CLAUDE.md Section 11).

tools:
  node: "v24.22.1"    # portable: C:\Users\mohit.bhatt\tools\node-v24.22.1-win-x64
  npm: "11.19.1"
  ffmpeg: "9.0.2"     # portable: C:\Users\mohit.bhatt\tools\ffmpeg-9.0.2-essentials_build\bin
  ffprobe: "9.0.2"
  python: "3.12.10"
  remotion: "4.0.539" # @remotion/cli; bundles its own render binary
  faster_whisper: "1.2.1"
  scenedetect: "0.7.2"

# NOTE: Node and FFmpeg are portable (user-scope) installs under C:\Users\mohit.bhatt\tools,
# not on the system PATH. The pipeline scripts source scripts/_toolpath.sh, which adds the
# newest node-*/ and ffmpeg-*/bin to PATH automatically. For npm/npx, prepend
# C:\Users\mohit.bhatt\tools\node-v24.22.1-win-x64 to PATH (or run from that dir).

defaults:
  fps: 30             # 25 only if supplied footage is 25; never mixed
  conform:
    resolution_16x9: "1920x1080"
    resolution_9x16: "1080x1920"
    fps: 30
    pixel_format: "yuv420p"
    color: "rec709"
    audio: "48000 stereo"

budget:
  per_run_usd_ceiling: 10   # stop and ask above this for any paid generation / TTS run

loudness:
  integrated_lufs: -14
  true_peak_dbtp: -1
  dialogue_short_term_lufs: -16
  music_under_speech_lufs: -24
  music_solo_lufs: -16
