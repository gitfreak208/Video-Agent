# Project-wide configuration for the Antier Video Production Agent.
# Record tool versions here during first-run setup (CLAUDE.md Section 11).

tools:
  node: "v24.22.1"    # portable install at C:\Users\mohit.bhatt\tools\node-v24.22.1-win-x64 (not on system PATH)
  npm: "11.19.1"
  ffmpeg: ""          # NOT INSTALLED — download blocked by permission policy; see STATUS below
  ffprobe: ""         # NOT INSTALLED (ships with ffmpeg)
  python: "3.12.10"
  remotion: "4.0.539" # @remotion/cli; bundles its own render binary (no system ffmpeg needed to render)
  faster_whisper: "1.2.1"   # uses PyAV (bundled ffmpeg libs) — transcription works without system ffmpeg
  scenedetect: "0.7.2"

# NOTE: Node is a portable (user-scope) install, not on PATH. Prepend
# C:\Users\mohit.bhatt\tools\node-v24.22.1-win-x64 to PATH, or run npm/npx from there.
# FFmpeg (system binary) is still needed for probe/proxy/cut/normalise/concat and
# export-platforms.sh. Its install was blocked by the auto-mode permission policy
# (third-party build host). Awaiting an approved install method.

defaults:
  fps: 30             # 25 only if supplied footage is 25; never mixed
  conform:
    resolution_16x9: "1920x1080"
    resolution_9x16: "1080x1920"
    fps: 30
    pixel_format: "yuv420p"
    color: "rec709"
    audio: "48000 stereo"

budget:
  per_run_usd_ceiling: 10   # stop and ask above this for any paid generation / TTS run

loudness:
  integrated_lufs: -14
  true_peak_dbtp: -1
  dialogue_short_term_lufs: -16
  music_under_speech_lufs: -24
  music_solo_lufs: -16
